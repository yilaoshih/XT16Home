<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex, nofollow"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>新泰16班 本壘報</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="我們班的班刊：聯絡簿、閱讀心得、活動點滴、親職文章與球場表現">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: a sports-feature class newsletter in the 新泰國中 team kit — fiery red, deep charcoal, white.
   60-30-10: light cool-gray page with white cards (60) / charcoal hero, nav and headlines (30) / red accents with a touch of gold (10).
   Noto Sans TC 900 for headlines (tight, slightly slanted for speed), 400 for reading; Oswald for numbers, dates and jersey numbers.
   Slanted cuts (skewX(-6deg) on badges, angled band edges, jersey-stripe slashes in the hero) carry the running-and-swinging motion. */
:root{
  --page:#F4F5F7; --band:#E9EBEF; --band-warm:#FFFFFF; --card:#FFFFFF;
  --head:#18191C; --on-head:#FFFFFF; --ink:#2B2D33; --ink-2:#686D76; --rule:#DFE2E7;
  --link:#C21D27;
  --leaf:#18191C; --leaf-ink:#FFFFFF; --leaf-soft:#E9EBEF;
  --sun:#FFB800; --sun-ink:#8A5A00; --sun-soft:#FFF3D1; --on-sun:#18191C;
  --berry:#D9232E; --berry-soft:#FCE6E7;
  --btn:#D9232E; --btn-hover:#B81C26;
  --plum:#4A4F59; --plum-soft:#ECEEF1;
  --alert:#C62828;
  --hero:#18191C; --hero-ink:#FFFFFF; --hero-ink-2:#B9BDC4; --hero-line:rgba(255,255,255,.07);
  --board:#18191C; --board-line:#2E3036; --chalk:#FFFFFF; --chalk-2:#A9ADB5; --bulb:#FFB800;
  --win:#D9232E; --loss:#8A8F98; --tie:#8A5A00;
  --shadow:0 6px 16px rgba(24,25,28,.08);
  --shadow-up:0 12px 24px rgba(24,25,28,.12);
  --f-head:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Oswald","Noto Sans TC","PingFang TC",sans-serif;
  --r:10px;
  --slant:skewX(-6deg);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0F1012; --band:#16171A; --band-warm:#141518; --card:#1C1D21;
    --head:#FFFFFF; --on-head:#18191C; --ink:#E3E5E8; --ink-2:#9CA1AA; --rule:#2B2D33;
    --link:#FF6B73;
    --leaf:#E3E5E8; --leaf-ink:#18191C; --leaf-soft:#25272C;
    --sun:#FFB800; --sun-ink:#FFC940; --sun-soft:#2E2510; --on-sun:#18191C;
    --berry:#FF4D57; --berry-soft:#3A1A1D;
    --plum:#C3C7CF; --plum-soft:#25272C;
    --alert:#FF8A80;
    --board:#0A0B0C; --board-line:#24262B; --chalk:#FFFFFF; --chalk-2:#9CA1AA; --bulb:#FFB800;
    --win:#FF4D57; --loss:#8C929E; --tie:#FFC940;
    --shadow:0 6px 16px rgba(0,0,0,.35);
    --shadow-up:0 12px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0F1012; --band:#16171A; --band-warm:#141518; --card:#1C1D21;
  --head:#FFFFFF; --on-head:#18191C; --ink:#E3E5E8; --ink-2:#9CA1AA; --rule:#2B2D33;
  --link:#FF6B73;
  --leaf:#E3E5E8; --leaf-ink:#18191C; --leaf-soft:#25272C;
  --sun:#FFB800; --sun-ink:#FFC940; --sun-soft:#2E2510; --on-sun:#18191C;
  --berry:#FF4D57; --berry-soft:#3A1A1D;
  --plum:#C3C7CF; --plum-soft:#25272C;
  --alert:#FF8A80;
  --board:#0A0B0C; --board-line:#24262B; --chalk:#FFFFFF; --chalk-2:#9CA1AA; --bulb:#FFB800;
  --win:#FF4D57; --loss:#8C929E; --tie:#FFC940;
  --shadow:0 6px 16px rgba(0,0,0,.35);
  --shadow-up:0 12px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-weight:400;font-size:16px;line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:780px}
a{color:var(--link)}
:focus-visible{outline:2.5px solid var(--sun);outline-offset:2px;border-radius:4px}
.muted{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.t-leaf{--tone:var(--leaf);--tone-soft:var(--leaf-soft)}
.t-sun{--tone:var(--sun-ink);--tone-soft:var(--sun-soft)}
.t-berry{--tone:var(--berry);--tone-soft:var(--berry-soft)}
.t-plum{--tone:var(--plum);--tone-soft:var(--plum-soft)}
.ico{width:24px;height:24px;flex:none}

/* slanted badge: the shape leans, the text stays upright */
.chip,.fold-count,.cv-tag,.seat,.mvp .badge,.picks-head .muted,.vid-dur{position:relative;z-index:0;isolation:isolate}
.chip::before,.fold-count::before,.cv-tag::before,.seat::before,.mvp .badge::before,.picks-head .muted::before,.vid-dur::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:3px;transform:var(--slant);background:var(--badge-bg)}

/* sample notice */
.samplebar{background:var(--sun-soft);color:var(--ink);font-size:.85rem}
.samplebar .wrap{padding-block:7px}
.samplebar b{color:var(--sun-ink)}

/* top bar: charcoal, like the jersey body, with the red trim on top */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--hero);color:var(--hero-ink);border-top:4px solid var(--btn);box-shadow:0 1px 0 var(--hero-line)}
.topbar .wrap{display:flex;align-items:center;flex-wrap:wrap;gap:0 24px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--hero-ink);font-family:var(--f-head);font-weight:900;font-size:1.2rem;letter-spacing:-.01em;padding-block:12px;flex:none}
.brand span{display:inline-block;transform:var(--slant)}
.brand .ico{width:26px;height:26px;color:var(--btn)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.nav::-webkit-scrollbar{display:none}
.nav a{position:relative;flex:none;padding:16px 10px 15px;color:var(--hero-ink-2);text-decoration:none;font-weight:700;white-space:nowrap;transition:color .15s}
.nav a:hover{color:var(--hero-ink)}
.nav a[aria-current="page"]{color:var(--hero-ink)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:4px;background:var(--btn);transform:skewX(-20deg)}
.search{position:relative;display:flex;align-items:center}
.search input{width:180px;height:36px;padding:0 12px 0 34px;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:rgba(255,255,255,.08);color:var(--hero-ink);font:inherit;font-size:.92rem;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--hero-ink-2)}
.search input:focus{outline:2px solid var(--btn);outline-offset:1px;background:rgba(255,255,255,.14)}
.search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--hero-ink-2);pointer-events:none;display:grid}
.search-ico svg{width:16px;height:16px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bigsearch{display:flex;gap:10px;margin-bottom:22px}
.bigsearch input{flex:1;min-width:0;height:46px;padding:0 16px;border:1px solid var(--rule);border-radius:var(--r);background:var(--card);color:var(--ink);font:inherit;font-size:1.02rem;-webkit-appearance:none;appearance:none;box-shadow:var(--shadow)}
.bigsearch input:focus{outline:2px solid var(--btn);outline-offset:1px}
.res-count{margin:0 0 16px;color:var(--ink-2);font-size:.92rem}
.res-h{display:flex;align-items:baseline;gap:8px;font-family:var(--f-head);font-weight:900;letter-spacing:-.01em;font-size:1.2rem;margin:26px 0 10px;color:var(--tone)}
.res-h small{font-family:var(--f-num);font-weight:500;font-size:.85rem;color:var(--ink-2)}
.res-h:first-of-type{margin-top:0}
mark{background:var(--sun-soft);color:inherit;border-radius:3px;padding:0 1px;box-shadow:inset 0 -2px 0 var(--sun)}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.sugg a{text-decoration:none}

/* player page hero */
.pl-hero{position:relative;overflow:hidden;background:var(--board);color:var(--chalk);padding:16px 0 34px;border-bottom:6px solid var(--btn)}
.pl-hero::before{content:"";position:absolute;top:-10%;bottom:-10%;right:22%;width:56px;background:var(--btn);transform:skewX(-20deg);opacity:.9;pointer-events:none}
.pl-hero::after{content:"";position:absolute;top:-10%;bottom:-10%;right:calc(22% - 30px);width:10px;background:var(--bulb);transform:skewX(-20deg);pointer-events:none}
.pl-hero .wrap{position:relative;z-index:1}
.pl-hero .pager a{color:var(--chalk-2)}
.pl-hero .pager a:hover{color:var(--chalk)}
.pl-mark{position:absolute;right:-40px;bottom:-70px;width:320px;height:320px;color:var(--board-line);pointer-events:none}
.pl-id{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:end}
.pl-photo{position:relative;margin:0;width:184px;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:#E9ECF1;border:4px solid var(--chalk);box-shadow:0 12px 28px rgba(0,0,0,.35)}
.pl-photo img{display:block;width:100%;height:100%;object-fit:cover}
.pl-photo figcaption{position:absolute;left:0;right:0;bottom:0;padding:5px 0;text-align:center;font-size:.78rem;color:#4A5160;background:rgba(255,255,255,.78)}
.pl-team{margin:0;font-family:var(--f-num);font-weight:500;font-size:.95rem;color:var(--chalk-2);letter-spacing:.08em}
.pl-name h2{font-family:var(--f-head);font-weight:900;letter-spacing:-.02em;font-size:clamp(2.4rem,7vw,3.6rem);line-height:1.15;margin:2px 0 14px;color:var(--chalk);transform:var(--slant);transform-origin:left bottom}
.pl-num{font-family:var(--f-num);font-weight:700;color:var(--bulb);font-size:.8em;margin-left:.3em;letter-spacing:0}
.pl-facts{display:flex;flex-wrap:wrap;gap:10px 0;margin:0}
.pl-facts div{padding:0 18px;border-left:1px solid var(--board-line)}
.pl-facts div:first-child{padding-left:0;border-left:0}
.pl-facts dt{font-size:.78rem;color:var(--chalk-2)}
.pl-facts dd{margin:2px 0 0;font-family:var(--f-num);font-weight:600;font-size:1.15rem;letter-spacing:.02em}
.pl-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.pl-tabs::-webkit-scrollbar{display:none}
.pl-tabs button{position:relative;flex:none;font:inherit;font-weight:700;color:var(--ink-2);background:none;border:0;padding:14px 12px 13px;cursor:pointer}
.pl-tabs button:hover{color:var(--head)}
.pl-tabs button:hover::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:4px;background:var(--berry);transform:skewX(-20deg)}
.pl-tabs small{font-family:var(--f-num);font-weight:600;color:var(--berry)}
.pl-sec{scroll-margin-top:84px}
.pl-boxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pl-box{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;border-top:4px solid var(--berry)}
.pl-box h3{margin:0 0 10px;font-family:var(--f-num);font-size:1rem;font-weight:600;color:var(--head);letter-spacing:.04em}
.pl-cells{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;text-align:center}
.pl-cells span{display:block;font-size:.76rem;color:var(--ink-2)}
.pl-cells b{display:block;font-family:var(--f-num);font-weight:600;font-size:1.7rem;line-height:1.35;color:var(--head);font-variant-numeric:tabular-nums}
.pl-sub{font-size:1.02rem;font-weight:900;color:var(--head);margin:26px 0 10px}
.pl-none{color:var(--ink-2);font-weight:400;text-align:center!important;padding:18px 10px!important}
.pl-pitch{margin-top:48px}
.pl-pitch .pl-box{border-top-color:var(--head)}
.pl-foot{margin:14px 0 0;font-size:.84rem;color:var(--ink-2)}
.pl-trophies{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pl-trophies li{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:16px;align-items:center;padding:14px 18px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.pl-trophies b{grid-row:span 2;font-family:var(--f-head);font-weight:900;font-size:1.25rem;line-height:1.5;padding:2px 14px;color:var(--on-sun);background:var(--sun);transform:var(--slant)}
.pl-trophies span{font-size:.92rem;line-height:1.45;color:var(--head);font-weight:700}
.pl-trophies small{color:var(--ink-2);font-family:var(--f-num);font-size:.85rem}
.pl-bio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:0 0 16px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.pl-bio div{padding:12px 18px;border-bottom:1px solid var(--rule)}
.pl-bio dt{font-size:.8rem;color:var(--ink-2)}
.pl-bio dd{margin:2px 0 0;font-weight:700;color:var(--head)}
.tbd{color:var(--ink-2);font-weight:400;font-size:.9rem;border:1px dashed var(--rule);border-radius:4px;padding:0 6px}
.pl-intro{padding:18px 20px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);line-height:1.9}
.pl-intro p{margin:0 0 .6em}.pl-intro p:last-child{margin:0}
.tbd-box{background:none;box-shadow:none;border:1.5px dashed var(--rule);color:var(--ink-2);text-align:center}
.note.focus{outline:3px solid var(--sun);outline-offset:3px;animation:flash 1.6s ease-out 1}
@keyframes flash{0%{outline-color:transparent}20%{outline-color:var(--sun)}100%{outline-color:var(--sun)}}
@media (prefers-reduced-motion:reduce){.note.focus{animation:none}}
.lockbox{max-width:420px;margin:28px auto 0;padding:28px 24px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);text-align:center;border-top:4px solid var(--berry)}
.lock-ico{width:52px;height:52px;margin:0 auto 10px;border-radius:8px;display:grid;place-items:center;background:var(--head);color:var(--on-head);transform:var(--slant)}
.lockbox h3{font-family:var(--f-head);font-weight:900;letter-spacing:-.01em;font-size:1.3rem;color:var(--head);margin:0 0 4px}
.lockbox p{margin:0;color:var(--ink-2);font-size:.95rem}
.lock-row{display:flex;gap:8px;justify-content:center;margin-top:16px}
.lock-row input{width:140px;height:44px;padding:0 14px;border:1px solid var(--rule);border-radius:8px;background:var(--page);color:var(--head);font-family:var(--f-num);font-size:1.25rem;letter-spacing:.3em;text-align:center}
.lock-row input:focus{outline:2px solid var(--berry);outline-offset:1px}
.lockbox .lock-err{color:var(--alert);margin-top:10px;font-weight:500}
.stat .other{color:var(--ink-2)}
.stat .dec{display:inline-block;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--berry);color:#fff;font-size:.72rem;font-weight:700;vertical-align:1px}
.player{position:relative}
.player .av{margin-left:auto;flex:none;width:40px;height:52px;border-radius:6px;background:#E9ECF1;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--rule)}
.player .av{position:relative}
.player .av img{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.player .avno{display:none}
.pl-photo.has-photo figcaption{display:none}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 0 16px;padding:12px 16px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);border-left:4px solid var(--berry)}
.bulk-t{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--head)}
.bulk-t .ico{width:18px;height:18px;color:var(--berry)}
.bulk-row{display:inline-flex;gap:8px;margin-left:auto}
.bulk-row input{width:120px;height:40px;padding:0 12px;border:1px solid var(--rule);border-radius:8px;background:var(--page);color:var(--head);font-family:var(--f-num);font-size:1.1rem;letter-spacing:.3em;text-align:center}
.bulk-row input:focus{outline:2px solid var(--berry);outline-offset:1px}
.bulk .lock-err{flex-basis:100%;color:var(--alert);font-weight:500;margin:0}
.player .lk{position:absolute;top:8px;right:8px;width:14px;height:14px;color:var(--ink-2);opacity:.75;display:grid}
.player .lk svg{width:100%;height:100%}

/* hero banner: charcoal with jersey-stripe slashes and a home-plate watermark */
.banner{position:relative;overflow:hidden;isolation:isolate;background:var(--hero);color:var(--hero-ink);border-bottom:6px solid var(--btn)}
.banner .wrap{position:relative;z-index:2}
.banner.home .wrap{padding-block:72px 80px}
.banner.page .wrap{padding-block:46px 52px}
.hero-photo{position:absolute;inset:0;z-index:0;pointer-events:none}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 70%;opacity:.12;filter:saturate(.6)}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--hero) 55%,transparent) 0%,transparent 70%)}
.hero-deco{position:absolute;inset:0;z-index:1;pointer-events:none}
.hero-deco i{position:absolute;top:-20%;bottom:-20%;transform:skewX(-20deg)}
.hero-deco .s1{right:14%;width:72px;background:var(--btn)}
.hero-deco .s2{right:calc(14% - 34px);width:12px;background:var(--bulb)}
.hero-deco .s3{right:calc(14% + 104px);width:26px;background:var(--hero-line)}
.hero-deco svg{position:absolute;right:-50px;bottom:-90px;width:330px;height:330px;color:var(--hero-line)}
.banner.page .hero-deco svg{width:240px;height:240px;bottom:-80px}
.banner h1,.banner h2{display:inline-block;font-family:var(--f-head);font-weight:900;letter-spacing:-.02em;line-height:1.12;margin:0;color:var(--hero-ink);transform:var(--slant);transform-origin:left bottom;text-wrap:balance}
.banner h1{font-size:clamp(2.8rem,9vw,4.6rem)}
.banner h2{font-size:clamp(2.1rem,6.5vw,3rem)}
.banner h1 .b-class{display:inline-block;vertical-align:.55em;font-size:.36em;font-weight:900;letter-spacing:.02em;line-height:1.5;padding:0 .5em;margin-right:.5em;background:var(--btn);color:#FFFFFF}
.banner p{margin:12px 0 0;max-width:34em;font-size:1.05rem;color:var(--hero-ink-2)}
.banner .motto{display:inline-block;margin-top:18px;padding:4px 18px;background:var(--bulb);color:var(--on-sun);font-weight:900;font-size:1.05rem;letter-spacing:.06em;transform:var(--slant)}
.banner .motto .m-zh{white-space:nowrap}
.banner .motto .m-en{font-family:var(--f-num);font-weight:700;font-size:1.12em;letter-spacing:.04em;margin-right:.35em;text-transform:uppercase}

/* bands and headings */
.band{padding-block:48px}
.band.alt{background:var(--band);clip-path:polygon(0 26px,100% 0,100% 100%,0 100%);margin-top:-26px;padding-top:74px}
.band.warm{background:var(--band-warm)}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;margin-bottom:22px}
.sec-title{font-family:var(--f-head);font-weight:900;letter-spacing:-.02em;font-size:clamp(1.6rem,4.6vw,2.05rem);line-height:1.25;margin:0;color:var(--head)}
.sec-title::before{content:"";display:inline-block;width:.34em;height:.92em;margin-right:.38em;vertical-align:-.1em;background:var(--berry);transform:skewX(-14deg)}
.sec-head p{margin:0;color:var(--ink-2);font-size:.92rem}
.kicker{margin:0;text-wrap:balance;font-family:var(--f-num);font-size:.88rem;font-weight:500;color:var(--tone,var(--berry));letter-spacing:.06em}
.back{display:inline-flex;margin-bottom:16px;text-decoration:none;font-weight:700}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}

.btn{position:relative;z-index:0;isolation:isolate;display:inline-flex;align-items:center;gap:6px;width:fit-content;padding:10px 24px;background:none;color:#FFFFFF;font:inherit;font-weight:700;letter-spacing:.02em;text-decoration:none;border:0;cursor:pointer;transition:transform .15s}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:6px;background:var(--btn);transform:var(--slant);transition:background .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn:hover::before{background:var(--btn-hover);box-shadow:0 6px 14px rgba(217,35,46,.28)}
.btn .ico{width:18px;height:18px}
.btn.ghost{color:var(--head)}
.btn.ghost::before{background:transparent;box-shadow:inset 0 0 0 2px var(--head)}
.btn.ghost:hover::before{background:transparent;box-shadow:inset 0 0 0 2px var(--berry)}
.btn.ghost:hover{color:var(--berry)}
.btn.off{color:var(--ink-2);cursor:default;transform:none}
.btn.off::before{background:var(--band);box-shadow:none}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.chip{display:inline-block;font-size:.8rem;font-weight:700;line-height:1.7;padding:0 10px;color:var(--tone,var(--head));--badge-bg:var(--tone-soft,var(--leaf-soft))}
.empty{padding:28px;border-radius:var(--r);background:var(--card);border:1.5px dashed var(--rule);color:var(--ink-2);text-align:center}
.empty p{margin:0}

/* covers: used on every story and card; photos when there are any, otherwise a tinted tile with speed stripes */
.cover{display:grid;place-items:center;align-content:center;gap:4px;padding:16px;border-radius:var(--r);color:var(--tone);
  background-color:var(--tone-soft);background-image:repeating-linear-gradient(-60deg,color-mix(in srgb,var(--tone) 9%,transparent) 0 10px,transparent 10px 24px);text-align:center}
.cover .ico{width:56px;height:56px}
.cover.lg{min-height:250px}
.cover.sm{aspect-ratio:16/8;max-width:100%;border-radius:var(--r) var(--r) 0 0}
.cover.sm .ico{width:40px;height:40px}
.cover.t-berry{background-color:var(--board);color:var(--chalk);background-image:repeating-linear-gradient(-60deg,rgba(255,255,255,.045) 0 10px,transparent 10px 24px),linear-gradient(105deg,transparent 0 72%,var(--btn) 72% 78%,transparent 78%)}
.cv-score{font-family:var(--f-num);font-weight:700;font-size:3.8rem;line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.cover.t-berry .cv-score{color:var(--chalk)}
.cv-score i{font-style:normal;color:var(--ink-2);margin:0 .12em}
.cover.t-berry .cv-score i{color:var(--bulb)}
.cover.sm .cv-score{font-size:2.4rem}
.cv-sub{font-size:.92rem;font-weight:700}
.cover.t-berry .cv-sub{color:var(--chalk-2)}
.res{display:inline-grid;place-items:center;width:2em;height:2em;border-radius:4px;font-weight:900;font-size:.85rem;color:#FFFFFF;flex:none;line-height:1;transform:var(--slant)}
.res.W{background:var(--win)} .res.L{background:var(--loss)} .res.T{background:var(--tie)}

/* featured story */
.story{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;align-items:center}
.story>a{text-decoration:none;display:block;min-width:0}
.story>a .cover{box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}
.story>a:hover .cover{transform:translateY(-4px);box-shadow:0 0 0 2px var(--berry),var(--shadow-up)}
.story-body{display:grid;gap:10px;align-content:start;min-width:0}
.story-title{font-family:var(--f-head);font-weight:900;letter-spacing:-.02em;font-size:clamp(1.6rem,4.6vw,2.2rem);line-height:1.3;margin:0;text-wrap:balance}
.story-title a{color:var(--head);text-decoration:none}
.story-title a:hover{color:var(--berry)}
.story-body p{margin:0;max-width:38em}
.story-meta{font-size:.9rem;color:var(--ink-2)}
.story ul{margin:0;padding-left:1.2em;color:var(--ink-2)}
.mvp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.95rem}
.mvp .badge{font-family:var(--f-num);font-weight:700;font-size:.78rem;letter-spacing:.08em;color:var(--on-sun);padding:1px 10px;--badge-bg:var(--sun)}
.mvp a{color:var(--head);font-weight:700;text-decoration:none}

/* news cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:32px}
.card{display:grid;grid-template-rows:auto 1fr;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);overflow:hidden;min-width:0;transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 0 0 2px var(--berry),var(--shadow-up)}
.card-body{padding:14px 18px 18px;display:grid;gap:4px;align-content:start}
.card h3{font-family:var(--f-head);font-weight:900;letter-spacing:-.01em;font-size:1.15rem;line-height:1.4;color:var(--head);margin:0}
.clamp{margin:0;color:var(--ink-2);font-size:.92rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* teacher's note */
.note-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px 28px;align-items:start}
.note-mark{width:64px;height:64px;border-radius:8px;display:grid;place-items:center;background:var(--btn);color:#FFFFFF;transform:var(--slant)}
.note-mark .ico{width:32px;height:32px}
.teacher p{margin:0 0 .6em;font-size:1.1rem;line-height:1.95;max-width:36em}
.teacher .sign{font-size:.92rem;color:var(--ink-2);margin-top:8px}

/* directory tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.tile{display:grid;gap:4px;align-content:start;padding:20px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);min-width:0;border-top:4px solid var(--tone);transition:transform .18s ease,box-shadow .18s ease}
.tile:hover{transform:translateY(-4px);box-shadow:0 0 0 2px var(--berry),var(--shadow-up)}
.tile-ico{width:48px;height:48px;border-radius:8px;display:grid;place-items:center;background:var(--tone-soft);color:var(--tone);margin-bottom:6px;transform:var(--slant)}
.tile b{font-family:var(--f-head);font-weight:900;letter-spacing:-.01em;font-size:1.2rem;color:var(--head)}
.tile span{font-size:.9rem;color:var(--ink-2)}
.tile small{font-family:var(--f-num);font-size:.85rem;color:var(--tone);font-weight:500;margin-top:4px;letter-spacing:.02em}

/* collapsible groups */
.folds{border-top:2px solid var(--head)}
.fold{border-bottom:1px solid var(--rule)}
.fold>summary{display:flex;align-items:center;gap:10px;padding:16px 4px;cursor:pointer;list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary:hover .fold-title{color:var(--berry)}
.fold-title{font-family:var(--f-head);font-weight:900;font-size:1.12rem;color:var(--head);transition:color .15s}
.fold-count{flex:none;white-space:nowrap;font-family:var(--f-num);font-size:.8rem;font-weight:500;line-height:1.7;padding:0 10px;color:var(--on-head);--badge-bg:var(--head)}
.fold-chev{margin-left:auto;display:grid;place-items:center;width:32px;height:32px;border-radius:6px;background:var(--card);color:var(--head);box-shadow:var(--shadow);transition:transform .2s}
.fold[open] .fold-chev{transform:rotate(180deg);background:var(--btn);color:#FFFFFF}
.fold-body{padding:2px 0 20px}

/* list rows inside folds */
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:14px 18px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);border-left:4px solid transparent;transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
a.row:hover{transform:translateY(-3px);border-left-color:var(--berry);box-shadow:0 0 0 2px var(--berry),var(--shadow-up)}
.row-main{display:grid;gap:1px;min-width:0}
.row-main small{font-family:var(--f-num);color:var(--ink-2);font-size:.85rem;letter-spacing:.03em}
.row-main b{font-weight:700;line-height:1.5;color:var(--head)}
.row-main .clamp{-webkit-line-clamp:1}
.row-side{font-size:.85rem;color:var(--ink-2);white-space:nowrap}
.score-chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-num);font-weight:700;font-size:1.35rem;color:var(--head);font-variant-numeric:tabular-nums}

/* article */
.paper{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:34px 40px;border-top:6px solid var(--head)}
.paper-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.paper-title{font-family:var(--f-head);font-weight:900;letter-spacing:-.02em;font-size:clamp(1.8rem,5.4vw,2.5rem);line-height:1.28;color:var(--head);margin:10px 0 6px;text-wrap:balance}
.paper-src{margin:0 0 20px;font-size:.9rem;color:var(--ink-2)}
.paper-fig{margin:0 0 24px;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;background:var(--band)}
.paper-fig img{display:block;width:100%;height:100%;object-fit:cover}
.prose{border-top:1px solid var(--rule);padding-top:22px}
.prose p{margin:0 0 1.1em;font-size:1.06rem;line-height:2}
.prose p:last-child{margin-bottom:0}
.letter-body .pts{margin:0 0 1.2em;padding:0;list-style:none;display:grid;gap:12px}
.letter-body .pts li{padding:14px 16px 14px 18px;border-radius:8px;background:var(--tone-soft);border-left:4px solid var(--tone);line-height:1.95;font-size:1.02rem}
.letter-body .pts li b{display:block;color:var(--tone);font-weight:900;margin-bottom:2px}
.letter-body .pq{position:relative;margin:0 0 1.1em;padding:6px 0 6px 22px;border-left:4px solid var(--berry);font-size:1.08rem;font-weight:500;color:var(--head)}
.letter-body .pq p{margin:0 0 .3em;font-size:inherit;line-height:1.9}
.letter-body .lt-sub{font-family:var(--f-head);font-weight:900;letter-spacing:-.01em;font-size:1.3rem;color:var(--head);margin:1.6em 0 .6em;padding-top:1.1em;border-top:1px solid var(--rule)}
.ext{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;margin:0 0 1.2em;padding:14px 16px;border-radius:var(--r);background:var(--card);text-decoration:none;color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--rule);transition:transform .18s ease,box-shadow .18s ease}
.ext:hover{transform:translateY(-4px);box-shadow:0 0 0 2px var(--berry),var(--shadow-up)}
.ext-ico{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;background:var(--tone-soft);color:var(--tone);transform:var(--slant)}
.ext small{display:block;font-size:.82rem;color:var(--ink-2)}
.ext b{display:block;font-weight:700;line-height:1.5;color:var(--head)}
.ext-go{color:var(--berry)}
.ext-go .ico{width:20px;height:20px}
.paper-note{margin:20px 0 4px;padding:12px 16px;border-left:4px solid var(--alert);background:color-mix(in srgb,var(--alert) 6%,transparent);color:var(--alert);font-size:.95rem;line-height:1.8}
.paper-note p{margin:0 0 .4em}
.paper-note p:last-child{margin-bottom:0}
.paper-note .paper-note-h{font-weight:900}
.picks{margin-top:40px}
.picks-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.picks-head h3{font-family:var(--f-head);font-weight:900;letter-spacing:-.02em;font-size:1.5rem;color:var(--head);margin:0}
.picks-head .muted{font-size:.8rem;font-weight:700;line-height:1.7;padding:0 10px;color:var(--on-sun);--badge-bg:var(--sun)}

/* reflections: white cards with a colored kit stripe and a big quote mark */
.notes{display:grid;gap:14px}
.note{position:relative;margin:0;padding:20px 24px 18px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);border-left:5px solid var(--berry);overflow:hidden}
.note:nth-child(3n+2){border-left-color:var(--head)}
.note:nth-child(3n){border-left-color:var(--sun)}
.note::before{content:"\201C";position:absolute;top:-14px;right:14px;font-family:var(--f-num);font-weight:700;font-size:5rem;line-height:1;color:var(--berry);opacity:.14;pointer-events:none}
.note blockquote{position:relative;margin:0;font-weight:400;font-size:1.05rem;line-height:1.95;color:var(--ink)}
.note blockquote p{margin:0 0 .5em}
.note blockquote p:last-child{margin-bottom:0}
.note figcaption{margin-top:10px;font-size:.9rem;font-weight:700;color:var(--head);display:flex;align-items:center;gap:10px}
.seat{font-family:var(--f-num);font-weight:600;font-size:.82rem;display:inline-grid;place-items:center;min-width:2.4em;height:1.7em;padding:0 5px;color:var(--on-head);--badge-bg:var(--head)}

.think{margin-top:30px;padding-top:22px;border-top:1px solid var(--rule);display:grid;gap:12px}
.think h3,.task h3{font-family:var(--f-head);font-weight:900;letter-spacing:-.01em;font-size:1.3rem;color:var(--head);margin:0}
.q{padding:16px 20px;border-radius:8px;background:var(--page);border-left:4px solid var(--head)}
.q p{margin:0;line-height:1.95}
.q .q-label{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--head);margin-bottom:4px}
.q .chip{--badge-bg:var(--card)}
.task{margin-top:22px;padding:20px 22px;border-radius:8px;background:var(--sun-soft);border-left:5px solid var(--sun);display:grid;gap:6px}
.task p{margin:0;line-height:1.9}
.task-label{font-size:.82rem;color:var(--sun-ink);font-weight:900;letter-spacing:.06em;margin-top:4px!important}
.task .task-hint{font-size:.92rem;color:var(--ink-2);border-top:1px dashed color-mix(in srgb,var(--sun) 60%,transparent);padding-top:8px;margin-top:4px}
.task .topic{font-weight:900;letter-spacing:-.01em;color:var(--head);font-size:clamp(1.15rem,3.8vw,1.4rem);line-height:1.6}

/* activity photos */
.cover.photo,.cover.sm.photo{padding:0;position:relative;overflow:hidden;background:var(--band);display:block}
.cover.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover.lg.photo{min-height:0;aspect-ratio:4/3}
.cv-tag{position:absolute;left:12px;bottom:12px;color:#FFFFFF;font-size:.8rem;font-weight:700;line-height:1.8;padding:0 12px;--badge-bg:var(--btn)}
.album-note{display:flex!important;align-items:center;gap:8px;font-size:.92rem;color:var(--ink-2);background:var(--card);box-shadow:var(--shadow);border-radius:8px;padding:6px 14px;width:fit-content}
.album-note .ico{width:18px;height:18px;color:var(--berry)}
.gallery{margin-top:40px}
.stack>.gallery{margin-top:0}
.act-notes{margin-top:44px}
.vids{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));max-width:760px}
.vid{margin:0}
.vid-btn{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:0;border-radius:var(--r);overflow:hidden;cursor:pointer;background:#000;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}
.vid-btn img{display:block;width:100%;height:100%;object-fit:cover;opacity:.9}
.vid-btn:hover{transform:translateY(-4px);box-shadow:0 0 0 2px var(--berry),var(--shadow-up)}
.vid-btn:hover img{opacity:1}
.vid-btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.vid-play{position:absolute;inset:0;margin:auto;width:72px;height:72px;border-radius:8px;background:var(--btn);display:grid;place-items:center;transform:var(--slant);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.vid-play svg{width:28px;height:28px;fill:#fff;margin-left:4px}
.vid-dur{position:absolute;right:12px;bottom:12px;padding:1px 10px;color:#fff;font-family:var(--f-num);font-weight:500;font-size:.85rem;--badge-bg:rgba(24,25,28,.8)}
.vid video{display:block;width:100%;aspect-ratio:16/9;border-radius:var(--r);background:#000}
.vid figcaption{margin-top:8px;font-size:.88rem;color:var(--ink-2)}
.vid-err{margin:6px 0 0;font-size:.88rem;color:var(--alert)}
.act-notes .task{margin:0 0 16px}
@media (min-width:821px){.notes.two{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.photos{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:12px}
.ph{padding:0;border:0;border-radius:var(--r);overflow:hidden;cursor:zoom-in;aspect-ratio:1;max-width:100%;background:var(--band);display:block;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph:hover{transform:translateY(-4px);box-shadow:0 0 0 2px var(--berry),var(--shadow-up)}

/* photo viewer */
.lb{position:fixed;inset:0;z-index:50;background:rgba(15,16,18,.95);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 56px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(10px,env(safe-area-inset-left,0px))}
.lb figure{margin:0;display:grid;gap:12px;justify-items:center;min-width:0}
.lb img{max-width:100%;max-height:calc(100dvh - 170px);object-fit:contain;border-radius:var(--r);display:block}
.lb figcaption{color:#F4F5F7;font-size:1rem;text-align:center}
.lb button{background:rgba(255,255,255,.12);color:#FFFFFF;border:0;border-radius:8px;width:46px;height:46px;font-size:1.5rem;line-height:1;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.lb button:hover{background:var(--btn)}
.lb-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px))}
.lb-count{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);left:max(16px,env(safe-area-inset-left,0px));color:#B9BDC4;font-size:1rem;font-family:var(--f-num);letter-spacing:.06em}

/* baseball */
.record{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:28px}
.record div{background:var(--card);border-radius:var(--r);padding:14px 18px;box-shadow:var(--shadow);display:grid;border-left:4px solid var(--berry)}
.record b{font-family:var(--f-num);font-weight:700;font-size:1.85rem;line-height:1.25;color:var(--head);font-variant-numeric:tabular-nums}
.record span{font-size:.85rem;color:var(--ink-2)}
.roster{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.player{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);min-width:0;transition:transform .18s ease,box-shadow .18s ease}
.player:hover{transform:translateY(-4px);box-shadow:0 0 0 2px var(--berry),var(--shadow-up)}
.jersey{flex:none;width:46px;height:46px;border-radius:8px;display:grid;place-items:center;background:var(--head);color:var(--on-head);font-family:var(--f-num);font-weight:700;font-size:1.35rem;transform:var(--slant)}
.player:hover .jersey{background:var(--btn);color:#FFFFFF}
/* 名字一律改成「紅色圓底＋座號」（個人頁以外） */
.sb{display:inline-grid;place-items:center;flex:none;box-sizing:border-box;width:2.05em;height:2.05em;border-radius:50%;background:var(--btn);color:#FFFFFF;font-family:var(--f-num);font-weight:600;font-size:.82em;font-style:normal;line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums;vertical-align:.08em;margin:0 .12em;text-decoration:none;text-indent:0}
a .sb,a.sb{transition:background .15s,box-shadow .15s}
a:hover .sb,a.sb:hover{background:var(--btn-hover);box-shadow:0 0 0 2px var(--sun)}
.sb.hit{box-shadow:0 0 0 2px var(--sun)}
.sbw{white-space:nowrap}
.player .sb{width:54px;height:54px;font-size:1.45rem;margin:0}
.who .sb{width:84px;height:84px;font-size:2.3rem;margin:0}
.note figcaption .sb{font-size:.95rem;margin:0}
.ldr li a{display:inline-flex;align-items:center}
.ldr li a .sb{margin:0}
.stat td .sb{margin:0 .1em}
.mvp a .sb{margin:0}
.pager .sb{margin:0 .2em}
.player b{display:block;font-weight:900;line-height:1.4;color:var(--head)}
.player small{display:block;color:var(--ink-2);font-size:.8rem;line-height:1.4}
.player>span:last-child{min-width:0}
.leaders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ldr{padding:14px 16px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border-top:4px solid var(--head)}
.ldr h4{margin:0 0 8px;font-size:.95rem;font-weight:900;color:var(--head);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.ldr h4 small{font-weight:400;color:var(--ink-2);font-size:.75rem}
.ldr ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}

<script>
(() => {
const D = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https:\/\//i.test(String(u || '')) ? String(u) : '';
const pad2 = n => String(n).padStart(2, '0');
const WD = '日一二三四五六';
const dt = s => new Date(s + 'T00:00:00');
const fmtD = s => { const d = dt(s); return `${d.getFullYear()}.${pad2(d.getMonth()+1)}.${pad2(d.getDate())}`; };
const md = s => { const d = dt(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const wd = s => WD[dt(s).getDay()];
const byDateDesc = (a, b) => b.date.localeCompare(a.date) || (b.seq || 0) - (a.seq || 0);
const paras = t => String(t || '').split(/\n+/).map(x => x.trim()).filter(Boolean);
const firstSentence = t => { const m = String(t || '').match(/^[^。！？]*[。！？]/); return m ? m[0] : String(t || ''); };
// 名字一律改成「紅色圓底＋座號」：個人頁以外不顯示稱呼。
// 文字裡先把同學換成記號 \uE000座號\uE001，輸出 HTML 時（rt／tk）再換成紅色圓形徽章。
const TK = seat => `\uE000${pad2(+seat)}\uE001`;
const seatBadge = (seat, hit) => `<span class="sb${hit ? ' hit' : ''}" title="${+seat} 號">${pad2(+seat)}</span>`;
// 徽章後面緊接的標點（、，。）跟徽章黏在一起，避免換行後「、」跑到行首
const tk = html => String(html).replace(/\uE000((?:<\/?mark>|\d)+)\uE001([、，。；：！？）」』]?)/g, (_, x, pu) => { const b = seatBadge(x.replace(/<[^>]*>/g, ''), x.includes('<mark>')); return pu ? `<span class="sbw">${b}${pu}</span>` : b; }).replace(/[\uE000\uE001]/g, '');
const rt = s => tk(esc(s));
// 資料裡的「1號朱」「14號陳又」（背號＋稱呼）換成記號；只換背號和稱呼對得上班級名單的
function tokNames(t){
  if (!t) return t || '';
  return String(t).replace(/(\d{1,2})\s*號\s*([\u4e00-\u9fff]{1,2})/g, (m, n, name) => {
    const p = D.baseball.players.find(x => x.number === +n), k = p && D.kids.get(p.seat);
    return k && name.startsWith(k.nickname) ? TK(p.seat) + name.slice(k.nickname.length) : m;
  });
}

// ---------- icons (stroked line art) ----------
const ICON = {
  book: '<path d="M12 6.5C10.2 5 7.6 4.4 4 4.6v13.2c3.6-.2 6.2.4 8 1.9 1.8-1.5 4.4-2.1 8-1.9V4.6c-3.6-.2-6.2.4-8 1.9zM12 6.5v13.2"/>',
  camera: '<rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.6"/><path d="M8.6 7l1.4-2.6h4L15.4 7"/>',
  ball: '<circle cx="12" cy="12" r="9"/><path d="M7.6 4.9c1.9 1.9 2.6 4.4 2 7.1-.4 1.9-1.4 3.6-2.9 4.9M16.4 19.1c-1.9-1.9-2.6-4.4-2-7.1.4-1.9 1.4-3.6 2.9-4.9"/>',
  note: '<rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 8.5h6M9 12h6M9 15.5h3.5"/>',
  pen: '<path d="M4 20l1-4.2L15.6 5.2a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.2 19 4 20zM14 6.8l3.2 3.2"/>',
  chev: '<path d="M6.5 9.5l5.5 5.5 5.5-5.5"/>',
  letter: '<rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M4.2 7.2L12 13l7.8-5.8"/>',
  lock: '<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>',
  out: '<path d="M14 4h6v6M20 4l-9 9M18 14v4.5A1.5 1.5 0 0 1 16.5 20h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/>',
};
const icon = k => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</g></svg>`;
const TONES = {'班級活動':'leaf','節慶活動':'sun','校外教學':'sun','球隊應援':'berry'};
const actTone = t => TONES[t] || ['leaf','sun','berry'][[...String(t)].reduce((a, c) => a + c.charCodeAt(0), 0) % 3];

// ---------- baseball stats ----------
const BK = ['ab','h','d','t','hr','rbi','r','bb','hbp','so','sb','sf'];
function sumBat(lines){ const t = Object.fromEntries(BK.map(k => [k, 0])); for (const l of lines) for (const k of BK) t[k] += +l[k] || 0; return t; }
const rate = (n, d) => d ? (n / d).toFixed(3).replace(/^0(?=\.)/, '') : '—';
const avg = t => rate(t.h, t.ab);
const obp = t => rate(t.h + t.bb + t.hbp, t.ab + t.bb + t.hbp + t.sf);
const slg = t => rate(t.h + t.d + 2*t.t + 3*t.hr, t.ab);
const outsOf = ip => { const [w, f = '0'] = String(ip).split('.'); return (+w) * 3 + (+f || 0); };
const ipStr = o => `${Math.floor(o/3)}.${o%3}`;
const era = (er, outs) => outs ? (er * D.site.inningsPerGame * 3 / outs).toFixed(2) : '—';
function sumPit(lines){ const t = {outs:0,h:0,r:0,er:0,bb:0,so:0,pitches:0}; for (const l of lines){ t.outs += outsOf(l.ip); for (const k of ['h','r','er','bb','so','pitches']) t[k] += +l[k] || 0; } return t; }
const tot = a => a.reduce((x, v) => x + (v ?? 0), 0);
function score(g){ const us = g.lineScore ? tot(g.lineScore.us) : (g.final?.us ?? 0), them = g.lineScore ? tot(g.lineScore.them) : (g.final?.them ?? 0); return {us, them, res: us > them ? 'W' : us < them ? 'L' : 'T'}; }
const RES = {W:'勝', L:'敗', T:'和'};

// ---------- automatic game report: written only from the box score, never invents details ----------
const CN = ['','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五'];
const halfName = h => `${CN[h.inn] || h.inn}局${h.half}`;
const cmpS = (u, t) => u > t ? 'us' : u < t ? 'them' : 'tie';
// 戰報裡的名字：班上同學用「紅色圓底＋座號」（文字裡先放記號，輸出時換成徽章），其他年級的隊友用遮名
const who = l => l.seat ? TK(l.seat) : (l.name || '隊友');
function gameStates(g){
  const us = g.lineScore.us, them = g.lineScore.them, n = Math.max(us.length, them.length);
  const away = g.home ? them : us, home = g.home ? us : them, out = [];
  let u = 0, t = 0;
  for (let i = 0; i < n; i++){
    for (const [half, line, team] of [['上', away, g.home ? 'them' : 'us'], ['下', home, g.home ? 'us' : 'them']]){
      const r = line[i]; if (r == null) continue;
      const before = cmpS(u, t);
      if (team === 'us') u += r; else t += r;
      out.push({inn: i + 1, half, team, runs: r, u, t, before, after: cmpS(u, t), i: out.length});
    }
  }
  return out;
}
function ipText(ip){ const o = outsOf(ip), w = Math.floor(o / 3), f = o % 3; return w && f ? `${w} 又 ${f}/3 局` : w ? `${w} 局` : `${f}/3 局`; }
function teamLine(g, side){
  const ts = g.teamStats?.[side] || {};
  if (side === 'us'){ const has = (g.batting || []).length, t = sumBat(g.batting || []); return has ? {h:t.h, bb:t.bb, so:t.so} : {h:ts.h ?? 0, bb:ts.bb ?? 0, so:ts.so ?? 0}; }
  const has = (g.pitching || []).length, t = sumPit(g.pitching || []); return has ? {h:t.h, bb:t.bb, so:t.so} : {h:ts.h ?? 0, bb:ts.bb ?? 0, so:ts.so ?? 0};
}
const teamShort = () => D.site.teamShort || D.site.teamName;
const metaText = g => [esc(g.event), g.slot ? esc(g.slot) : '', g.venue ? esc(g.venue) : '', g.home == null ? '' : g.home ? '後攻' : '先攻'].filter(Boolean).join('・');
function leadText(g){
  const d = dt(g.date), s = score(g), team = teamShort();
  const where = g.venue ? (!g.home && g.venue === g.opponent ? `作客${g.opponent}` : `在${g.venue}迎戰${g.opponent}`) : `迎戰${g.opponent}`;
  return `${d.getMonth()+1} 月 ${d.getDate()} 日${g.event ? `的${g.event}` : ''}，${team}${where}，終場以 ${s.us}:${s.them} ${s.res === 'W' ? '獲勝' : s.res === 'L' ? '落敗' : '戰成平手'}。`;
}
function flowText(g){
  const S = gameStates(g), opp = g.opponent, scoring = S.filter(s => s.runs > 0);
  if (!scoring.length) return '雙方投手都把對手壓制得很好，整場比賽沒有人跑回本壘。';
  const last = S[S.length - 1];

    if (b === 'theirs' && a === 'mine') return `${at}攻下 ${n} 分${s.team === 'us' ? '逆轉超前' : '反超'}`;
    if (b === 'tie' && a === 'mine') return `${at}攻下 ${n} 分${s.u + s.t - n > 0 ? '打破平手' : '取得領先'}`;

  if (pick.length > 5) pick = scoring.filter((s, i) => i === 0 || s.before !== s.after);
  let prev = null;
  const text = pick.map(s => { const sub = s.team === prev ? '' : (s.team === 'us' ? '我們' : opp); prev = s.team; return sub + phrase(s, s === scoring[0]); }).join('，');

const perf = b => (b.h || 0) * 2 + (b.rbi || 0) * 1.5 + (b.hr || 0) * 3 + (b.d || 0) + (b.t || 0) * 2 + (b.sb || 0) * .5 + (b.r || 0) * .5;

  if (!(g.batting || []).length){
    const u = teamLine(g, 'us');
    return `打擊方面，全隊${u.h ? `擊出 ${u.h} 支安打` : '沒有擊出安打'}、選到 ${u.bb} 次保送，被三振 ${u.so} 次。`;
  }
  const t = sumBat(g.batting);
  if (!t.h) return `打擊方面，對手投手壓制力很強，全隊沒有擊出安打${t.bb ? `，靠 ${t.bb} 次保送製造機會` : ''}。`;
  const top = g.batting.filter(b => b.h || b.rbi).sort((a, b) => perf(b) - perf(a)).slice(0, 3);
  const one = b => {
    if (!b.h) return `${who(b)}雖然沒有安打，仍貢獻 ${b.rbi} 分打點`;

    return `${who(b)} ${b.ab} 打數 ${b.h} 安打${xb.length ? `（含 ${xb.join('、')}）` : ''}${b.rbi ? `，貢獻 ${b.rbi} 分打點` : ''}${b.sb >= 2 ? `，還跑出 ${b.sb} 次盜壘` : ''}`;
  };
  return `打擊方面，全隊敲出 ${t.h} 支安打${t.hr ? `，其中有 ${t.hr} 支全壘打` : ''}。${top.map(one).join('；')}。`;

    s = `投球方面，先發投手${who(sp)}主投 ${ipText(sp.ip)}，${sp.h ? `被擊出 ${sp.h} 支安打` : '沒有被擊出安打'}，${sp.r ? `失 ${sp.r} 分${sp.er < sp.r ? `（自責分 ${sp.er}）` : ''}` : '沒有失分'}，送出 ${sp.so} 次三振。`;
    if (rp.length){ const so = tot(rp.map(p => p.so)); s += `${rp.map(who).join('、')}${rp.length > 1 ? '接力' : '接手'}後援${so ? `，再送出 ${so} 次三振` : ''}。`; }
  } else if (g.teamStats?.them){
    const t = teamLine(g, 'them');
    s = `投球方面，投手群讓${g.opponent}擊出 ${t.h} 支安打，投出 ${t.bb} 次保送、${t.so} 次三振。`;
  }

  if (e === 0) s += '全場守備零失誤。'; else if (e >= 2) s += `守備出現 ${e} 次失誤，是下一場可以再加強的地方。`;

}
function autoHeadline(g){
  if (!g.lineScore){ const r = score(g); return `${r.us}:${r.them} ${r.res === 'W' ? '擊敗' : r.res === 'L' ? '不敵' : '戰平'}${g.opponent}`; }
  const s = score(g), opp = g.opponent, diff = Math.abs(s.us - s.them), S = gameStates(g), last = S[S.length - 1];
  const h = teamLine(g, 'us').h, hr = sumBat(g.batting || []).hr;
  if (s.res === 'W'){
    const back = S.some(x => x.after === 'them') ? '逆轉！' : '';
    const big = S.filter(x => x.team === 'us').sort((a, b) => b.runs - a.runs)[0];
    const hook = hr >= 2 ? `${hr} 支全壘打，` : h >= 10 ? `全隊 ${h} 支安打，` : big && big.runs >= 4 ? `${halfName(big)}一口氣攻下 ${big.runs} 分，` : g.errors?.us === 0 ? '守備零失誤，' : '';

  if (s.res === 'L') return last.team === 'them' && last.before !== 'them' ? `${s.us}:${s.them} 最後半局遭逆轉，惜敗${opp}` : `${s.us}:${s.them} ${diff <= 2 ? '惜敗' : '不敵'}${opp}`;

const gHead = g => tokNames(g.headline) || autoHeadline(g);

// collapsible groups render their contents only when opened
const FOLDS = new Map(); let foldSeq = 0;
function fold(title, count, render, open = false){
  const id = 'f' + (++foldSeq);
  FOLDS.set(id, render);
  return `<details class="fold" data-fold="${id}"${open ? ' open' : ''}><summary><span class="fold-title">${title}</span>${count != null ? `<span class="fold-count">${count}</span>` : ''}<span class="fold-chev">${icon('chev')}</span></summary><div class="fold-body"></div></details>`;
}
function fillFold(d){
  const body = d.querySelector(':scope > .fold-body');
  if (!body || body.dataset.done) return;
  const f = FOLDS.get(d.dataset.fold);
  if (f){ body.innerHTML = f(); body.dataset.done = '1'; }
}
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset?.fold && d.open) fillFold(d); }, true);

function extLink(a){
  const url = safeUrl(a?.url);
  if (!url) return '';
  return `<a class="ext" href="${esc(url)}" target="_blank" rel="noopener"><span class="ext-ico">${icon('book')}</span><span><small>一起讀的文章${a.source ? '・' + esc(a.source) : ''}</small><b>${esc(a.title || '文章連結')}</b></span><span class="ext-go">${icon('out')}</span></a>`;
}
// body 寫法：一行一段；「* 」開頭是重點條列（全形冒號前面會變粗體小標）；「> 」開頭是引文；「## 」開頭是小標題；「[文章]」放文章連結卡
function letterBody(p){
  const lines = String(p.body || '').split('\n').map(s => s.trim()).filter(Boolean);
  let out = '', list = [], quote = [], linked = false;
  const flush = () => {
    if (list.length) out += `<ul class="pts">${list.map(t => { const i = t.indexOf('：'); return i > 0 && i < 40 ? `<li><b>${esc(t.slice(0, i))}</b>${esc(t.slice(i + 1))}</li>` : `<li>${esc(t)}</li>`; }).join('')}</ul>`;
    if (quote.length) out += `<blockquote class="pq">${quote.map(t => `<p>${esc(t)}</p>`).join('')}</blockquote>`;
    list = []; quote = [];
  };
  for (const l of lines){
    if (l.startsWith('* ')){ if (quote.length) flush(); list.push(l.slice(2)); continue; }
    if (l.startsWith('> ')){ if (list.length) flush(); quote.push(l.slice(2)); continue; }
    flush();
    if (l === '[文章]'){ out += extLink(p.article); linked = true; }
    else if (l.startsWith('## ')) out += `<h3 class="lt-sub">${esc(l.slice(3))}</h3>`;
    else out += `<p>${esc(l)}</p>`;
  }
  flush();
  return out + (linked ? '' : extLink(p.article));
}

function avgChart(log){
  if (log.length < 2) return '';
  let h = 0, ab = 0;
  const pts = log.slice().reverse().map(x => { h += x.h; ab += x.ab; return {d: x.g.date, v: ab ? h/ab : 0}; });
  const W = 640, H = 200, L = 46, R = 16, T = 18, Bm = 30;
  const max = Math.max(0.5, Math.ceil(Math.max(...pts.map(p => p.v)) * 10) / 10);
  const x = i => L + (W - L - R) * (i / (pts.length - 1));
  const y = v => T + (H - T - Bm) * (1 - v / max);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area = `${line}L${x(pts.length-1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z`;
  const last = pts[pts.length - 1];
  return `<div class="chart"><p>累積打擊率，每場比賽後更新</p><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="累積打擊率走勢">
    ${[0, max/2, max].map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--rule)" stroke-width="1"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="12" fill="var(--ink-2)" font-family="var(--f-num)">${rate(t, 1)}</text>`).join('')}
    <path d="${area}" fill="var(--leaf)" fill-opacity=".14"/>
    <path d="${line}" fill="none" stroke="var(--leaf)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="${i === pts.length-1 ? 5 : 3.5}" fill="${i === pts.length-1 ? 'var(--berry)' : 'var(--leaf)'}"/><text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--ink-2)" font-family="var(--f-num)">${md(p.d)}</text>`).join('')}
    <text x="${x(pts.length-1) - 4}" y="${y(last.v) - 11}" text-anchor="end" font-size="14" font-weight="800" fill="var(--berry)" font-family="var(--f-num)">${rate(last.v, 1)}</text>
  </svg></div>`;
}
// 球員個人頁密碼鎖：比對 sha256(salt:密碼)；同一個分頁開著時記住已解鎖的球員
const UNLOCKED = new Set();
function isOpen(seat){
  if (!D.baseball.lock) return true;
  if (UNLOCKED.has(+seat)) return true;
  try { return sessionStorage.getItem('unlock-' + (+seat)) === '1'; } catch (e) { return false; }
}
async function sha256hex(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
// 照片用密碼加密（AES-GCM，金鑰由 PBKDF2(密碼, photoSalt) 產生）；解鎖時把金鑰記在這個分頁
const PKEYS = new Map(), PHOTO_URL = new Map();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = u => btoa(String.fromCharCode(...u));
async function photoKey(pw){
  const L = D.baseball.lock;
  if (!L.photoSalt) return null;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const salt = Uint8Array.from(L.photoSalt.match(/../g), x => parseInt(x, 16));
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt, iterations:L.iter || 120000}, base, 256));
}
function rememberKey(seat, raw){
  if (!raw) return;
  PKEYS.set(+seat, raw);
  try { sessionStorage.setItem('pkey-' + (+seat), toB64(raw)); } catch (e) {}
}
function keyOf(seat){
  if (PKEYS.has(+seat)) return PKEYS.get(+seat);
  try { const s = sessionStorage.getItem('pkey-' + (+seat)); if (s){ const k = b64(s); PKEYS.set(+seat, k); return k; } } catch (e) {}
  return null;
}
function markOpen(seat){
  UNLOCKED.add(+seat);
  try { sessionStorage.setItem('unlock-' + (+seat), '1'); } catch (e) {}
}
// 一次輸入密碼：符合的球員全部解鎖（預設密碼相同時就是全部）
async function unlockMany(seats, pw){
  const L = D.baseball.lock;
  if (!window.crypto?.subtle) return [];
  const got = await sha256hex(`${L.salt}:${pw}`);
  const ok = seats.filter(s => ((L.players || {})[String(+s)] || L.default) === got);
  if (!ok.length) return ok;
  const raw = await photoKey(pw);
  for (const s of ok){ markOpen(s); rememberKey(s, raw); }
  return ok;
}
const tryUnlock = async (seat, pw) => (await unlockMany([+seat], pw)).length > 0;
async function hydratePhotos(){
  for (const img of document.querySelectorAll('#view img[data-enc]')){
    const seat = +img.dataset.seat;
    try {
      if (!PHOTO_URL.has(seat)){
        const raw = keyOf(seat);
        if (!raw) continue;
        const f = await (await fetch(img.dataset.enc, {cache:'no-cache'})).json();
        const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
        const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(f.iv)}, key, b64(f.ct));
        PHOTO_URL.set(seat, URL.createObjectURL(new Blob([plain], {type:'image/jpeg'})));
      }
      img.src = PHOTO_URL.get(seat);
      img.closest('.pl-photo')?.classList.add('has-photo');
    } catch (e) { /* 解不開就維持預設圖 */ }
  }
}

  for (const p of D.parents) I.push({kind:'親職文章', tone:'plum', date:p.date, title:p.title, sub:p.series, href:`#letter-${p.id}`, text:[p.summary, plain(p.body), p.article?.title].filter(Boolean).join('\n')});
  for (const a of D.activities){
    I.push({kind:'活動點滴', tone:'sun', date:a.date, title:a.title, sub:a.type, href:`#act-${a.id}`, text:[a.description, ...(a.highlights || []), ...(a.photos || []).map(x => x.caption), ...(a.videos || []).map(x => x.caption), a.reflectPrompt].filter(Boolean).join('\n')});
    for (const x of a.reflections || []) I.push({kind:'精選心得', tone:'leaf', date:a.date, title:`${TK(x.seat)} 的心得`, sub:a.title, href:`#act-${a.id}~${pad2(x.seat)}`, text:tokNames(x.text)});
  }
  for (const g of D.games) I.push({kind:'球場表現', tone:'berry', date:g.date, title:gHead(g), sub:`${g.tournament || g.event || ''}`, href:`#game-${g.id}`,
    text:[`vs ${g.opponent}`, g.event, g.slot, g.venue, ...gReport(g).paras, g.comment, ...(g.photos || []).map(x => x.caption)].filter(Boolean).join('\n')});
  for (const p of D.baseball.players) I.push({kind:'球員', tone:'berry', date:'', title:TK(p.seat), sub:(p.positions || []).join('・'), href:`#s-${pad2(p.seat)}`, text:`座號 ${pad2(p.seat)}・${p.seat} 號`});
  return I;
}
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function hl(s, terms){
  if (!terms.length) return esc(s);
  const re = new RegExp(`(${terms.map(reEsc).join('|')})`, 'gi');
  return String(s).split(re).map((part, i) => i % 2 ? `<mark>${esc(part)}</mark>` : esc(part)).join('');
}
function snippet(text, terms){
  const t = String(text || '').replace(/\s+/g, ' ');
  const low = t.toLowerCase();
  let at = -1;
  for (const w of terms){ const i = low.indexOf(w.toLowerCase()); if (i >= 0 && (at < 0 || i < at)) at = i; }
  // 擷取片段時不要把座號記號切成兩半
  const fitB = b => { const o = t.lastIndexOf('\uE000', b - 1); if (o >= 0){ const c = t.indexOf('\uE001', o); if (c >= b) return c + 1; } return b; };
  const fitA = a => { const o = t.lastIndexOf('\uE000', a - 1); return o >= 0 && t.indexOf('\uE001', o) >= a ? o : a; };
  if (at < 0){ const e = fitB(Math.min(t.length, 70)); return tk(esc(t.slice(0, e))) + (e < t.length ? '…' : ''); }
  const a = fitA(Math.max(0, at - 24)), b = fitB(Math.min(t.length, at + 70));
  return (a ? '…' : '') + tk(hl(t.slice(a, b), terms)) + (b < t.length ? '…' : '');
}
function searchHits(q){
  INDEX = INDEX || buildIndex();
  const terms = q.split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  return INDEX.map(it => {
    const T = it.title.toLowerCase(), X = `${it.sub || ''}\n${it.text}`.toLowerCase();
    let score = 0;
    for (const w of terms.map(w => w.toLowerCase())){
      const inT = T.includes(w), inX = X.includes(w);
      if (!inT && !inX) return null;
      score += inT ? 3 : 1;
    }
    return {it, score};
  }).filter(Boolean).sort((a, b) => b.score - a.score || b.it.date.localeCompare(a.it.date)).map(x => x.it);
}
const KINDS = ['閱讀心得', '精選心得', '親職文章', '活動點滴', '球場表現', '球員'];
const SUGG = ['大谷', '段考', '金剛盃', '校慶', '教養', '板凳'];
function resultsHTML(q){
  if (!q) return `<div class="empty"><p>輸入關鍵字開始搜尋，例如：</p><div class="sugg">${SUGG.map(w => `<a class="chip" href="#search=${encodeURIComponent(w)}">${esc(w)}</a>`).join('')}</div></div>`;
  const hits = searchHits(q), terms = q.split(/\s+/).filter(Boolean);
  if (!hits.length) return `<div class="empty"><p>找不到「${esc(q)}」相關的內容，換個關鍵字試試：</p><div class="sugg">${SUGG.map(w => `<a class="chip" href="#search=${encodeURIComponent(w)}">${esc(w)}</a>`).join('')}</div></div>`;
  const groups = KINDS.map(k => [k, hits.filter(x => x.kind === k)]).filter(([, l]) => l.length);
  return `<p class="res-count">「${esc(q)}」共找到 ${hits.length} 筆</p>` + groups.map(([k, list]) => `<h3 class="res-h t-${list[0].tone}">${k}<small>${list.length} 筆</small></h3><div class="rows">${list.map(x =>
    `<a class="row" href="${x.href}"><span class="row-main"><small>${x.date ? fmtD(x.date) : ''}${x.sub ? (x.date ? '・' : '') + esc(x.sub) : ''}</small><b>${tk(hl(x.title, terms))}</b><span class="clamp">${snippet(x.text, terms)}</span></span></a>`).join('')}</div>`).join('');
}
function vSearch(q){
  return banner('page', '搜尋', '找文章、心得、親職文章、活動和比賽。')
    + band('', `<form class="bigsearch" id="search-page" role="search"><input id="q2" type="search" value="${esc(q)}" placeholder="輸入關鍵字，例如：大谷、段考、佳林" aria-label="搜尋關鍵字" autocomplete="off" enterkeyhint="search"><button class="btn" type="submit">搜尋</button></form><div id="results">${resultsHTML(q)}</div>`, 'narrow');
}
function goSearch(q){
  q = q.trim();
  const h = 'search=' + encodeURIComponent(q);
  if (location.hash.slice(1) === h) route(); else location.hash = h;
}
$('#view').addEventListener('click', e => { const b = e.target.closest('[data-jump]'); if (b){ document.getElementById(b.dataset.jump)?.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); } });
$('#search-form').addEventListener('submit', e => { e.preventDefault(); const q = $('#q').value; if (q.trim()) { goSearch(q); $('#q').blur(); } });
let searchTimer = null;
$('#view').addEventListener('input', e => {
  if (e.target.id !== 'q2') return;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const q = e.target.value.trim();
    history.replaceState(null, '', '#search=' + encodeURIComponent(q));
    lastHash = location.hash.slice(1);
    $('#results').innerHTML = resultsHTML(q);
    $('#q').value = q;
  }, 220);
});
$('#view').addEventListener('submit', async e => {
  const sp = e.target.closest('#search-page');
  if (sp){ e.preventDefault(); goSearch($('#q2').value); return; }
  const bk = e.target.closest('#bulk-unlock');
  if (bk){
    e.preventDefault();
    const inp = bk.querySelector('input'), err = bk.querySelector('.lock-err');
    const ok = await unlockMany(D.baseball.players.map(p => p.seat), inp.value.trim());
    if (ok.length) route(); else { err.hidden = false; inp.value = ''; inp.focus(); }
    return;
  }
  const f = e.target.closest('.lockbox');
  if (!f) return;
  e.preventDefault();
  const inp = f.querySelector('input'), err = f.querySelector('.lock-err');
  if (await tryUnlock(f.dataset.seat, inp.value.trim())) route();
  else { err.hidden = false; inp.value = ''; inp.focus(); }
});

// ---------- router ----------
const VIEWS = {home: vHome, contact: vContact, reading: () => vReading(), gallery: () => vGallery(), baseball: vBaseball, parents: () => vParents()};
let lastHash = null;
function route(){
  FOLDS.clear();
  const h = location.hash.slice(1) || 'home';
  let html, tab;
  if (h.startsWith('game-')){ html = vGame(h.slice(5)); tab = 'baseball'; }
  else if (h.startsWith('read-')){ const [rid, fs] = h.slice(5).split('~'); html = vReading(rid, fs ? +fs : null); tab = 'reading'; }
  else if (h.startsWith('act-')){ const [aid, fs] = h.slice(4).split('~'); html = vGallery(aid, fs ? +fs : null); tab = 'gallery'; }
  else if (h.startsWith('letter-')){ html = vParents(h.slice(7)); tab = 'parents'; }
  else if (h.startsWith('search=')){ let q = ''; try { q = decodeURIComponent(h.slice(7)); } catch (e) { q = h.slice(7); } html = vSearch(q); tab = 'search'; $('#q').value = q; }
  else if (/^s-\d+$/.test(h)){ html = vPlayer(parseInt(h.slice(2), 10)); tab = 'baseball'; }
  else { tab = VIEWS[h] ? h : 'home'; html = VIEWS[tab](); }
  $('#view').innerHTML = html;
  document.querySelectorAll('#view details.fold[open]').forEach(fillFold);
  document.querySelectorAll('.nav a').forEach(a => a.dataset.v === tab ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  if (lastHash !== null && lastHash !== h) window.scrollTo(0, 0);
  const fn = document.querySelector('#view .note.focus');
  if (fn) requestAnimationFrame(() => fn.scrollIntoView({block:'center'}));
  hydratePhotos();
  lastHash = h;
}
// ---------- photo viewer ----------
let LB = null;
function lbShow(){
  const p = LB.photos[LB.i];
  $('#lb-img').src = p.src; $('#lb-img').alt = p.caption || '';
  $('#lb-cap').textContent = p.caption || '';
  $('#lb-count').textContent = `${LB.i + 1} / ${LB.photos.length}`;
  const nx = LB.photos[(LB.i + 1) % LB.photos.length]; if (nx) (new Image()).src = nx.src;
}
function lbOpen(photos, i, opener){ LB = {photos, i, opener}; $('#lb').hidden = false; document.body.style.overflow = 'hidden'; lbShow(); $('#lb-close').focus(); }
function lbClose(){ if (!LB) return; const o = LB.opener; LB = null; $('#lb').hidden = true; document.body.style.overflow = ''; o?.focus?.(); }
function lbStep(d){ if (LB){ LB.i = (LB.i + d + LB.photos.length) % LB.photos.length; lbShow(); } }
$('#view').addEventListener('click', e => {
  const b = e.target.closest('.ph'); if (!b) return;
  const a = D.activities.find(x => x.id === b.dataset.g) || D.games.find(x => x.id === b.dataset.g); if (a) lbOpen(a.photos, +b.dataset.i, b);
});
$('#view').addEventListener('click', e => {
  const b = e.target.closest('.vid-btn'); if (!b) return;
  const src = b.dataset.vsrc, fig = b.closest('.vid');
  const v = document.createElement('video');
  v.controls = true; v.playsInline = true; v.preload = 'auto';
  const poster = b.querySelector('img'); if (poster) v.poster = poster.src;
  let viaBlob = false;
  v.addEventListener('error', async () => {
    if (viaBlob) return; viaBlob = true;
    try { const r = await fetch(src); if (!r.ok) throw new Error(r.status); v.src = URL.createObjectURL(await r.blob()); v.play().catch(() => {}); }
    catch (err) { if (!fig.querySelector('.vid-err')) fig.insertAdjacentHTML('beforeend', '<p class="vid-err">影片暫時無法播放，請稍後再試。</p>'); }
  });
  v.src = src;
  b.replaceWith(v);
  v.play().catch(() => {});
});
$('#lb-close').addEventListener('click', lbClose);
$('#lb-prev').addEventListener('click', () => lbStep(-1));
$('#lb-next').addEventListener('click', () => lbStep(1));
$('#lb').addEventListener('click', e => { if (e.target.id === 'lb') lbClose(); });
document.addEventListener('keydown', e => { if (!LB) return; if (e.key === 'Escape') lbClose(); else if (e.key === 'ArrowRight') lbStep(1); else if (e.key === 'ArrowLeft') lbStep(-1); });
window.addEventListener('hashchange', () => { lbClose(); route(); });
load().then(() => { chrome(); route(); }).catch(err => {
  $('#view').innerHTML = band('', `<div class="empty"><p>資料載入失敗：${esc(err.message)}</p><p class="muted" style="margin-top:6px">請確認 data 資料夾裡的檔案都在，而且格式正確。</p></div>`);
});
})();
